plugins {
    id 'com.android.application'
}

def apiBaseUrls = [
    development: (findProperty('apiBaseUrlDevelopment') ?: 'http://192.168.10.10/').toString(),
    staging: (findProperty('apiBaseUrlStaging') ?: 'https://192.168.10.10/').toString(),
    production: (findProperty('apiBaseUrlProduction') ?: 'https://192.168.10.10/').toString()
]

def buildConfigString = { value ->
    "\"${value.replace('\\', '\\\\').replace('"', '\\"')}\""
}

android {
    compileSdkVersion 30

    flavorDimensions "environment"

    defaultConfig {
        applicationId "com.sinoll.synapse_app"
        minSdkVersion 28
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    productFlavors {
        development {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", buildConfigString(apiBaseUrls.development)
        }
        staging {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", buildConfigString(apiBaseUrls.staging)
        }
        production {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", buildConfigString(apiBaseUrls.production)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

afterEvaluate {
    ["preProductionDebugBuild", "preProductionReleaseBuild"].each { taskName ->
        tasks.named(taskName) {
            doFirst {
                def productionUrl
                try {
                    productionUrl = new java.net.URI(apiBaseUrls.production)
                } catch (java.net.URISyntaxException error) {
                    throw new GradleException("Set apiBaseUrlProduction to a valid production HTTPS API base URL.", error)
                }

                if (!"https".equalsIgnoreCase(productionUrl.scheme) || !productionUrl.host) {
                    throw new GradleException(
                            "Set -PapiBaseUrlProduction to a valid production HTTPS API base URL before building a production variant."
                    )
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}